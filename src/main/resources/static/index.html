<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cricket Score Management</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Live Platform</p>
          <h1>Cricket Score Management</h1>
        </div>
        <button id="refreshButton" class="primary-btn">Refresh Feed</button>
      </header>

      <section class="stats-grid">
        <div class="stat-card">
          <span>Active Matches</span>
          <strong id="activeMatches">0</strong>
        </div>
        <div class="stat-card">
          <span>Matches Completed</span>
          <strong id="completedMatches">0</strong>
        </div>
        <div class="stat-card">
          <span>Upcoming</span>
          <strong id="upcomingMatches">0</strong>
        </div>
        <div class="stat-card">
          <span>Data Feed</span>
          <strong id="feedStatus">Connected</strong>
        </div>
      </section>

      <main class="content-grid">
        <section class="panel">
          <div class="panel-header">
            <h2>Live Matches</h2>
            <button id="demoMatchButton" class="secondary-btn">Add Demo Match</button>
          </div>
          <div id="matchList" class="match-list"></div>
        </section>

        <aside class="panel detail-panel">
          <h2>Match Insights</h2>
          <div id="matchDetail" class="match-detail empty-state">
            Select a match to view live details.
          </div>
        </aside>
      </main>
    </div>

    <script src="/js/app.js"></script>
  </body>
</html>
